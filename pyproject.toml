[project]
name = "starmeme"
version = "0.1.0"
description = "Bot de Discord que vigila pump.fun 24/7 y genera tweets de meme coins de Solana."
requires-python = ">=3.11"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.flake8-bugbear]
# Idioma estándar de FastAPI para dependencias (control_ia/).
extend-immutable-calls = ["fastapi.Depends", "fastapi.File", "fastapi.params.Depends"]
